server {
    server_name hub.flyingmetaspace.cc;
    listen unix:/dev/shm/nginx.sock ssl proxy_protocol;
    http2 on;

    gzip on;

    ssl_certificate "/etc/nginx/ssl/flyingmetaspace.cc/fullchain.pem";
    ssl_certificate_key "/etc/nginx/ssl/flyingmetaspace.cc/privkey.pem";
    ssl_trusted_certificate "/etc/nginx/ssl/flyingmetaspace.cc/fullchain.pem";

    root /var/www/m6-lite-control;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
